<!doctype html>
<html lang="pt-BR">
  <head>

    <link rel="shortcut icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Meta Impulso | Marketing Digital, Tráfego Pago &amp; Software em Brasília</title>

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://metaimpulso.com.br/" />

    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://metaimpulso.com.br/" />
    <meta property="og:title" content="Meta Impulso | Aceleração Comercial com Marketing &amp; Tecnologia em Brasília" />
    <meta property="og:description" content="Tráfego pago de alta performance, websites sob medida, automações operacionais e soluções de IA em Brasília e nacionalmente. Agende um diagnóstico gratuito." />
    <meta property="og:image" content="https://metaimpulso.com.br/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://metaimpulso.com.br/" />

    <meta property="twitter:image" content="https://metaimpulso.com.br/og-image.png" />

    <!--
      Google Fonts: loaded asynchronously via preconnect + rel=preload trick.
      This avoids render-blocking caused by @import in CSS.
      We use display=swap to show fallback fonts immediately.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>

  </body>
</html>
