<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />

    <!-- Replaced per route at build time by scripts/prerender.mjs -->
    <!--seo:start-->
    <title>Meta Impulso | Marketing Digital, Tráfego Pago e Sites em Brasília</title>
    <meta name="description" content="Agência de marketing digital em Brasília que prova antes de prometer: Raio-X de Vendas grátis do seu site, tráfego pago, sites, CRM e IA com um só time." />
    <!--seo:end-->

    <!-- Google Fonts loaded without blocking render (display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Outfit:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
