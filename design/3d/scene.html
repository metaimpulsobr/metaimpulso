// Flat ramp/ribbon following a path (stays horizontal across its width)
function ribbon(points, width, thick, mat) {
  const pos = [], idx = []
  const n = points.length
  for (let i = 0; i < n; i++) {
    const p = points[i], q = points[Math.min(n - 1, i + 1)], o = points[Math.max(0, i - 1)]
    const dir = new THREE.Vector3().subVectors(q, o); dir.y = 0; dir.normalize()
    const side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(width / 2)
    const a = p.clone().add(side), b = p.clone().sub(side)
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z, a.x, a.y - thick, a.z, b.x, b.y - thick, b.z)
  }
  for (let i = 0; i < n - 1; i++) {
    const k = i * 4, m = k + 4
    const quad = (a, b, c, d) => idx.push(a, b, c, b, d, c)
    quad(k, k + 1, m, m + 1)           // top
    quad(k + 3, k + 2, m + 3, m + 2)   // bottom
    quad(k + 2, k, m + 2, m)           // side a
    quad(k + 1, k + 3, m + 1, m + 3)   // side b
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals()
  return add(g, mat)
}
// Thin rod between two points
function rod(a, b, r, mat) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length()
  const m = add(new THREE.CylinderGeometry(r, r, len, 8), mat)
  m.position.copy(a).addScaledVector(d, 0.5)
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize())
  return m
}

  const prof = []; for (let k = 0; k <= 40; k++) { const y = 0.3 + (k / 40) * 6.8; prof.push(new THREE.Vector2(radius(y) - 0.05, y)) }

  const g = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), glass); scene.add(g)

  camera = new THREE.PerspectiveCamera(22, W / H, 0.1, 300)

} else if (which === 'alvorada') {
  add(new THREE.BoxGeometry(13, 0.35, 4), concrete, 0, 2.6, 0)

  add(new THREE.BoxGeometry(13.4, 0.2, 4.6), concrete, 0, 0.1, 0)
  // Columns: touch the floor at a point, open into arches under the slab

  shape.moveTo(-0.62, 2.45); shape.bezierCurveTo(-0.25, 2.2, -0.07, 1.2, 0, 0.2); shape.bezierCurveTo(0.07, 1.2, 0.25, 2.2, 0.62, 2.45); shape.lineTo(-0.62, 2.45)

  for (let i = 0; i < 11; i++) add(colGeo, concrete, -6.2 + i * 1.24, 0, 2.05)
  add(new THREE.BoxGeometry(16, 0.05, 3), water, 0, 0.025, 4.4)

  camera.position.set(-17, 8, 27); camera.lookAt(-0.2, 1.35, 1.2)
} else if (which === 'museu') {
  const R = 3.2
  add(new THREE.SphereGeometry(R, 128, 64, 0, Math.PI * 2, 0, Math.PI / 2), concrete)

  // curved ramp rising from the ground into the dome
  const pts = []
  for (let i = 0; i <= 60; i++) {
    const t = i / 60, a = 2.75 - 1.3 * t, r = 7.6 - (7.6 - 2.95) * t, y = 0.06 + 1.25 * (t * t * (3 - 2 * t))
    pts.push(V(r * Math.cos(a), y, r * Math.sin(a)))

  for (const k of [18, 30, 42]) { const p = pts[k]; rod(V(p.x, 0, p.z), V(p.x, p.y - 0.12, p.z), 0.06, concrete) }
  camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 300)

  for (const [a, b] of spans) {

    add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, 0.2, 12, false), concrete)

    }

  }
  camera = new THREE.PerspectiveCamera(22, W / H, 0.1, 300)
  camera.position.set(-17, 9, 23); camera.lookAt(0.5, 2.2, 0)
} else if (which === 'planalto') {
  add(new THREE.BoxGeometry(15, 0.12, 6.5), concrete, 0, 0.06, 0)
  add(new THREE.BoxGeometry(13, 0.2, 5), concrete, 0, 1.05, 0)
  add(new THREE.BoxGeometry(13.6, 0.32, 5.4), concrete, 0, 3.5, 0)
  add(new THREE.BoxGeometry(12, 2.3, 4.1), glassMat, 0, 2.2, 0)
  const shape = new THREE.Shape()
  shape.moveTo(-0.5, 3.34); shape.bezierCurveTo(-0.18, 3.0, -0.05, 1.4, 0, 0.12); shape.bezierCurveTo(0.05, 1.4, 0.18, 3.0, 0.5, 3.34); shape.lineTo(-0.5, 3.34)
  const col = new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 32 })
  for (let i = 0; i < 9; i++) { add(col, concrete, -6 + i * 1.5, 0, 2.62); add(col, concrete, -6 + i * 1.5, 0, -2.78) }
  // the ramp up to the main floor
  const ramp = add(new THREE.BoxGeometry(1.6, 0.14, 4.6), concrete, -1.5, 0.55, 4.9); ramp.rotation.x = 0.21
  add(new THREE.BoxGeometry(6, 0.04, 3), water, 4.2, 0.03, 5.1)
  camera = new THREE.PerspectiveCamera(21, W / H, 0.1, 300)
  camera.position.set(-18, 9, 26); camera.lookAt(-0.3, 1.6, 1.4)
} else if (which === 'itamaraty') {
  add(new THREE.BoxGeometry(22, 0.04, 22), water, 0, 0.02, 0)
  add(new THREE.BoxGeometry(9.6, 0.12, 9.6), concrete, 0, 0.06, 0)
  add(new THREE.BoxGeometry(8.6, 3.0, 8.6), glassMat, 0, 1.6, 0)
  const W2 = 11, H2 = 4.1, n = 11, pier = 0.2
  const facade = () => {
    const sh = new THREE.Shape(); sh.moveTo(-W2 / 2, 0); sh.lineTo(W2 / 2, 0); sh.lineTo(W2 / 2, H2); sh.lineTo(-W2 / 2, H2); sh.lineTo(-W2 / 2, 0)
    const w = (W2 - (n + 1) * pier) / n, spring = H2 - 0.45 - w / 2
    for (let i = 0; i < n; i++) {

      const hole = new THREE.Path(); hole.moveTo(x0, 0); hole.lineTo(x0 + w, 0); hole.lineTo(x0 + w, spring); hole.absarc(x0 + w / 2, spring, w / 2, 0, Math.PI, false); hole.lineTo(x0, 0)
      sh.holes.push(hole)
    }
    return new THREE.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: false, curveSegments: 24 })
  }
  const f = facade()
  for (let k = 0; k < 4; k++) { const m = add(f, concrete); m.rotation.y = k * Math.PI / 2; m.position.set(Math.sin(k * Math.PI / 2) * (W2 / 2), 0, Math.cos(k * Math.PI / 2) * (W2 / 2)); m.translateZ(-0.11) }

  for (let i = 0; i < 8; i++) {
    const z = 10 - i * 3.6
    add(new THREE.BoxGeometry(3.6, 3.4, 1.1), concrete, -7, 1.7, z)
    add(new THREE.BoxGeometry(3.6, 3.4, 1.1), concrete, 7, 1.7, z)

  add(new THREE.BoxGeometry(0.7, 6, 1.3), concrete, -0.45, 3, -25.5)
  add(new THREE.BoxGeometry(0.7, 6, 1.3), concrete, 0.45, 3, -25.5)

  const bowl = add(new THREE.LatheGeometry(bw, 64), concrete.clone(), -2.4, 0.6, -23.8); bowl.material.side = THREE.DoubleSide
  const dm = add(new THREE.SphereGeometry(1.2, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), concrete, 2.4, 0.6, -23.8); dm.scale.set(1, 0.6, 1)
