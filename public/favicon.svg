<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="metaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B3529F" />
      <stop offset="50%" stop-color="#B3529F" />
      <stop offset="100%" stop-color="#6BCDE7" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF8FC" />
      <stop offset="50%" stop-color="#B3529F" />
      <stop offset="100%" stop-color="rgba(179, 82, 159, 0)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Transparent Background Rocket Shield -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#metaGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- Rocket Body & Thrust -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Exhaust Flame -->
    <path d="M 236 340 Q 256 460 256 460 Q 256 460 276 340 Z" fill="url(#flameGrad)" />
    <!-- Left Wing -->
    <path d="M 180 330 L 220 270 L 220 350 Z" fill="#725BA7" opacity="0.9" />
    <!-- Right Wing -->
    <path d="M 332 330 L 292 270 L 292 350 Z" fill="#6BCDE7" opacity="0.9" />
    <!-- Main Rocket Body -->
    <path d="M 256 80 C 290 150 300 240 292 350 L 220 350 C 212 240 222 150 256 80 Z" fill="url(#metaGrad)" />
    <!-- Cockpit Window -->
    <circle cx="256" cy="200" r="28" fill="#020308" stroke="#6BCDE7" stroke-width="6" />
    <circle cx="256" cy="200" r="14" fill="#6BCDE7" opacity="0.8" />
  </g>
</svg>